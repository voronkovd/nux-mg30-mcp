[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nux-mg30-mcp"
version = "0.1.0"
description = "MCP server that lets an AI assistant control a NUX MG-30 guitar processor over USB MIDI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["mcp", "midi", "nux", "mg-30", "guitar", "sysex", "claude"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Sound/Audio :: MIDI",
]
dependencies = [
  "mcp>=1.2,<2",
  "mido>=1.3",
  "python-rtmidi>=1.5",
]

[project.urls]
Homepage = "https://github.com/voronkovd/nux-mg30-mcp"
Issues = "https://github.com/voronkovd/nux-mg30-mcp/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nux-mg30-mcp = "nux_mg30_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nux_mg30_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
